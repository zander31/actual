<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Actual</title>
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link
      rel="manifest"
      href="/site.webmanifest"
      crossorigin="use-credentials"
    />
    <meta name="msapplication-TileColor" content="#5c3dbb" />
    <meta name="theme-color" content="#5c3dbb" />

    <style type="text/css">
      html,
      body {
        margin: 0;
        padding: 0;
        font-size: 13px;
      }

      html,
      body,
      button,
      input {
        font-family: var(
          --font-family,
          'Instrument Sans Variable',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          'Roboto',
          'Oxygen',
          'Ubuntu',
          'Cantarell',
          'Fira Sans',
          'Droid Sans',
          'Helvetica Neue',
          'Helvetica',
          'Arial',
          sans-serif
        );
      }

      a {
        color: inherit;
        text-decoration-skip: ink;
      }

      * {
        -webkit-box-sizing: border-box;
        -moz-box-sizing: border-box;
        box-sizing: border-box;
      }

      *:focus {
        outline-color: var(--color-pageTextLink, #00810a);
      }

      /* a keyboard ring that sits off the element instead of on it */
      *:focus-visible {
        outline: 2px solid var(--color-pageTextLink, #00810a);
        outline-offset: 2px;
        border-radius: 4px;
      }

      /* recharts makes chart surfaces and layers focusable for keyboard
         navigation; suppress the focus ring it would draw on click */
      .recharts-wrapper:focus,
      .recharts-wrapper :focus,
      .recharts-surface:focus,
      .recharts-surface :focus {
        outline: none;
      }

      input,
      textarea {
        font-size: 1em;
        font-family: var(
          --font-family,
          'Instrument Sans Variable',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          'Roboto',
          'Oxygen',
          'Ubuntu',
          'Cantarell',
          'Fira Sans',
          'Droid Sans',
          'Helvetica Neue',
          'Helvetica',
          'Arial',
          sans-serif
        );
        font-feature-settings:
          'ss01',
          'ss04',
          'calt' 0;
      }

      html,
      body,
      #root {
        height: 100%;
      }
      body {
        overflow: hidden;
      }

      .cm-theme-dark {
        height: 100%;
      }

      .cm-theme-light {
        height: 100%;
      }

      /* ── The surfaces the component tree never draws ──────────────────── */

      body {
        font-variant-numeric: tabular-nums;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      h1,
      h2,
      h3,
      .display {
        font-weight: 600;
        letter-spacing: -0.025em;
      }

      ::selection {
        background: var(--palette-purple150, #bdf4c3);
        color: var(--color-pageText, #1c1e21);
      }

      :root {
        caret-color: var(--color-pageTextPositive, #00810a);
        scrollbar-color: var(--color-tableBorderSeparator, #cbc9ca) transparent;
        scrollbar-width: thin;
      }

      ::-webkit-scrollbar {
        width: 11px;
        height: 11px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background: var(--color-tableBorderSeparator, #cbc9ca);
        border: 3px solid transparent;
        border-radius: 999px;
        background-clip: content-box;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: var(--color-pageTextSubdued, #6b6d72);
        border: 3px solid transparent;
        background-clip: content-box;
      }

      a {
        text-underline-offset: 0.18em;
        text-decoration-thickness: from-font;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
